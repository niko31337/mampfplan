services:
  mampfplan:
    build: .
    image: mampfplan:latest
    container_name: mampfplan
    restart: unless-stopped
    ports:
      # Only reachable locally. From outside, access goes through the reverse proxy (see docker-compose.caddy.yml).
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Named volume: automatically owned by the container user (no chown issues).
      # For backups on a NAS, mount a directory instead: ./data:/data
      # (run `chown 10001 data` first).
      - mampfplan-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mampfplan-data:
