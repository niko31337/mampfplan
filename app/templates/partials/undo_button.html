{% if undo and member %}
<form method="post" action="{{ base }}/undo" hx-post="{{ base }}/undo" hx-swap="none">
  <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
  <button class="btn-undo" title="Rückgängig: {{ undo.description }} ({{ undo.member_name }})">↶ Rückgängig</button>
</form>
{% endif %}
