# Production: Caddy as an HTTPS reverse proxy in front of Mampfplan (certificates from the server's certbot).
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# or permanently in .env:  COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml
services:
  mampfplan:
    # The app isn't published on the host (not even on 127.0.0.1): Caddy reaches it
    # directly in the Docker network. This also avoids port conflicts with other services.
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: mampfplan-caddy
    restart: unless-stopped
    depends_on:
      - mampfplan
    ports:
      - "8443:8443"
    environment:
      DOMAIN: ${DOMAIN:?Please set DOMAIN in .env}
      # Name of the certbot certificate (folder under live/); default: same as the domain
      CERT_NAME: ${CERT_NAME:-${DOMAIN}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Additional, server-specific proxies (not in the repository, see .gitignore)
      - ./deploy.local/sites:/etc/caddy/sites:ro
      # Whole certbot folder (live/ only contains symlinks to archive/), read-only
      - ${CERT_DIR:-/etc/letsencrypt}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The Caddy binary carries this capability as a file capability; without it, startup fails with
      # "exec /usr/bin/caddy: operation not permitted", even if only port 8443 is used.
      - NET_BIND_SERVICE

volumes:
  caddy-data:
  caddy-config:
